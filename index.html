<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>摆麻将 · Bai Mahjong</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#12141a;
    --bg-1:#181c1c;
    --jade:#3e8e5c;
    --jade-dark:#1f3a2a;
    --blue:#0a84ff;
    --blue-dark:#0066cc;
    --ivory:#f4eee0;
    --ivory-dim:#e9e1cd;
    --ink:#3a2a20;
    --red:#c5382a;
    --red-dark:#8e281e;
    --gold:#c9a227;
    --muted:#8b9199;
    --muted-2:#5c6167;
    --line: rgba(244,238,224,0.10);
    --shadow-deep: rgba(0,0,0,0.55);
  }

  *{box-sizing:border-box;}

  html,body{ margin:0; padding:0; min-height:100%; }

  body{
    background:
      radial-gradient(ellipse 900px 600px at 50% -10%, rgba(62,142,92,0.16), transparent 60%),
      linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%);
    color:var(--ivory);
    font-family:'Noto Sans SC', sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  .sparkle{
    position:fixed;
    width:5px;height:5px;
    background:var(--gold);
    clip-path: polygon(50% 0%, 63% 38%, 100% 50%, 63% 62%, 50% 100%, 37% 62%, 0% 50%, 37% 38%);
    opacity:0.55;
    animation: twinkle 4.5s ease-in-out infinite;
    pointer-events:none;
  }
  .s1{ top:14%; left:12%; animation-delay:0s; }
  .s2{ top:70%; left:8%;  width:3px; height:3px; animation-delay:1.2s; }
  .s3{ top:22%; left:88%; animation-delay:.6s; }
  .s4{ top:78%; left:90%; width:4px; height:4px; animation-delay:2s; }
  .s5{ top:48%; left:5%;  width:3px; height:3px; animation-delay:3s; }

  @keyframes twinkle{
    0%, 100%{ opacity:0.15; transform:scale(0.8); }
    50%{ opacity:0.8; transform:scale(1.15); }
  }
  @media (prefers-reduced-motion: reduce){ .sparkle{ animation:none; opacity:0.35; } }

  /* ---------- top-right menu ---------- */
  .menu-btn{
    position:fixed;
    top:18px; right:18px;
    width:38px; height:38px;
    border-radius:10px;
    border:1px solid var(--line);
    background:rgba(244,238,224,0.05);
    color:var(--ivory);
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
    cursor:pointer;
    z-index:1000;
    transition: background .2s ease, transform .15s ease;
  }
  .menu-btn:hover{ background:rgba(244,238,224,0.1); }
  .menu-btn:active{ transform:scale(0.95); }

  .dropdown-menu{
    display:none;
    position:fixed;
    top:62px; right:18px;
    background:#1b1f1f;
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    min-width:180px;
    box-shadow:0 14px 32px -8px var(--shadow-deep);
    z-index:1000;
  }
  .dropdown-menu a{
    display:block;
    padding:12px 16px;
    text-align:left;
    color:var(--ivory-dim);
    text-decoration:none;
    font-size:14.5px;
    border-bottom:1px solid var(--line);
    transition: background .15s ease, color .15s ease;
  }
  .dropdown-menu a:last-child{ border-bottom:none; }
  .dropdown-menu a:hover{ background:rgba(62,142,92,0.16); color:var(--ivory); }

  /* ---------- language switcher ---------- */
  .lang-btn{
    position:fixed;
    top:18px; right:66px;
    height:38px;
    padding:0 12px;
    border-radius:10px;
    border:1px solid var(--line);
    background:rgba(244,238,224,0.05);
    color:var(--ivory);
    display:flex; align-items:center; gap:6px;
    font-size:13.5px;
    font-weight:500;
    cursor:pointer;
    z-index:1000;
    transition: background .2s ease, transform .15s ease;
    white-space:nowrap;
  }
  .lang-btn:hover{ background:rgba(244,238,224,0.1); }
  .lang-btn:active{ transform:scale(0.96); }
  .lang-btn .lang-icon{ font-size:15px; line-height:1; }
  /* Show only the globe on the main button; language names stay in the dropdown. */
  .lang-btn .lang-label{ display:none; }
  .lang-btn{ width:38px; padding:0; justify-content:center; }

  .lang-dropdown{
    display:none;
    position:fixed;
    top:62px; right:66px;
    background:#1b1f1f;
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    min-width:150px;
    box-shadow:0 14px 32px -8px var(--shadow-deep);
    z-index:1000;
  }
  .lang-dropdown button{
    all:unset;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    padding:12px 16px;
    text-align:left;
    color:var(--ivory-dim);
    font-size:14.5px;
    font-family:inherit;
    cursor:pointer;
    border-bottom:1px solid var(--line);
    transition: background .15s ease, color .15s ease;
  }
  .lang-dropdown button:last-child{ border-bottom:none; }
  .lang-dropdown button:hover{ background:rgba(62,142,92,0.16); color:var(--ivory); }
  .lang-dropdown button.active{ color:var(--gold); font-weight:600; }
  .lang-dropdown button .check{ opacity:0; font-size:12px; }
  .lang-dropdown button.active .check{ opacity:1; }

  @media (max-width:380px){
    .lang-btn span.lang-label{ display:none; }
    .lang-btn{ padding:0; width:38px; justify-content:center; }
    .lang-dropdown{ right:62px; }
  }

  /* ---------- stage ---------- */
  .stage{
    width:100%;
    max-width:520px;
    margin:0 auto;
    padding:72px 28px 48px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .logo{
    width:96px;
    height:96px;
    border-radius:24px;
    overflow:hidden;
    box-shadow:
      0 0 0 1px rgba(244,238,224,0.06),
      0 16px 34px -8px rgba(0,0,0,0.65),
      0 0 50px -12px rgba(62,142,92,0.45);
    margin-bottom:20px;
    animation: rise .7s cubic-bezier(.2,.8,.2,1) both;
  }
  .logo img{ width:100%; height:100%; display:block; object-fit:cover; }

  h1.title{
    font-family:'Noto Serif SC', serif;
    font-weight:900;
    font-size:clamp(34px, 8vw, 44px);
    letter-spacing:0.06em;
    margin:0 0 8px;
    background: linear-gradient(180deg, var(--ivory) 0%, var(--ivory-dim) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation: rise .7s .05s cubic-bezier(.2,.8,.2,1) both;
  }

  .tagline{
    font-size:14px;
    color:var(--muted);
    letter-spacing:0.02em;
    margin:0 0 32px;
    animation: rise .7s .1s cubic-bezier(.2,.8,.2,1) both;
  }
  .tagline b{ color:var(--gold); font-weight:600; }

  @keyframes rise{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* ---------- info pills (replaces oversized flip tile) ---------- */
  .info-row{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom:36px;
    animation: rise .7s .15s cubic-bezier(.2,.8,.2,1) both;
  }

  .info-pill{
    all:unset;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
    padding:12px 20px;
    border-radius:999px;
    background:rgba(244,238,224,0.05);
    border:1px solid var(--line);
    color:var(--ivory-dim);
    font-size:14.5px;
    font-weight:500;
    letter-spacing:0.01em;
    transition: background .2s ease, transform .15s ease, border-color .2s ease;
  }
  .info-pill:hover{ background:rgba(62,142,92,0.14); border-color:rgba(62,142,92,0.4); }
  .info-pill:active{ transform:scale(0.97); }
  .info-pill .pill-icon{ font-size:16px; line-height:1; }

  /* ---------- download section ---------- */
  .dl-label{
    font-size:12px;
    letter-spacing:0.14em;
    color:var(--muted-2);
    text-transform:uppercase;
    margin-bottom:12px;
    animation: rise .7s .18s cubic-bezier(.2,.8,.2,1) both;
  }

  .downloads{
    display:flex;
    gap:14px;
    margin-bottom:14px;
    animation: rise .7s .2s cubic-bezier(.2,.8,.2,1) both;
  }

  .dl-btn{
    all:unset;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    width:150px;
    padding:13px 0 11px;
    border-radius:13px;
    font-size:15.5px;
    font-weight:600;
    letter-spacing:0.02em;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .dl-btn:active{ transform: translateY(1px) scale(0.98); }

  .dl-ios{
    background: linear-gradient(180deg, #2b98ff, var(--blue));
    color:#eaf4ff;
    box-shadow: 0 10px 22px -8px rgba(10,132,255,0.55), inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .dl-ios:hover{ box-shadow: 0 12px 26px -8px rgba(10,132,255,0.7), inset 0 1px 0 rgba(255,255,255,0.3); }

  .dl-android{
    background: linear-gradient(180deg, #4aa06e, var(--jade));
    color:#0e1a13;
    box-shadow: 0 10px 22px -8px rgba(62,142,92,0.55), inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .dl-android:hover{ box-shadow: 0 12px 26px -8px rgba(62,142,92,0.7), inset 0 1px 0 rgba(255,255,255,0.3); }

  .dl-icon{ font-size:13px; letter-spacing:0.06em; opacity:0.9; }
  .dl-sub{
    font-size:10.5px;
    font-weight:400;
    letter-spacing:0.08em;
    margin-top:2px;
    opacity:0.75;
  }

  .divider{
    width:36px;
    height:1px;
    background: rgba(244,238,224,0.14);
    margin: 30px 0 22px;
    animation: rise .7s .25s cubic-bezier(.2,.8,.2,1) both;
  }

  footer{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    font-size:12.5px;
    color:var(--muted-2);
    animation: rise .7s .3s cubic-bezier(.2,.8,.2,1) both;
  }
  footer a{ color:var(--gold); text-decoration:none; }
  footer a:hover{ color:#e0bb3a; }
  .copyright{ opacity:0.7; white-space:pre-line; }

  /* ---------- modal ---------- */
  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(10,12,12,0.66);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index:2000;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .modal-overlay.open{ display:flex; }

  .modal-card{
    width:100%;
    max-width:440px;
    max-height:80vh;
    overflow-y:auto;
    background: linear-gradient(155deg, var(--ivory) 0%, var(--ivory-dim) 100%);
    border-radius:20px;
    padding:30px 28px 26px;
    text-align:left;
    color:var(--ink);
    box-shadow: 0 24px 60px -10px rgba(0,0,0,0.6);
    position:relative;
    animation: pop .28s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes pop{
    from{ opacity:0; transform:translateY(12px) scale(0.97); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  .modal-close{
    position:absolute;
    top:14px; right:16px;
    font-size:12px;
    color:var(--muted-2);
    letter-spacing:0.05em;
    cursor:pointer;
    background:none;
    border:none;
    font-family:inherit;
  }

  .modal-label{
    font-size:12px;
    letter-spacing:0.16em;
    color:var(--red-dark);
    font-weight:700;
    margin-bottom:14px;
    text-transform:uppercase;
  }

  .modal-card p{ margin:0 0 12px; font-size:14px; line-height:1.85; color:var(--ink); }
  .modal-card p:last-child{ margin-bottom:0; }
  .modal-card p.section-head{ font-weight:700; color:var(--ink); margin-top:16px; margin-bottom:6px; }
  .modal-card p.section-head:first-child{ margin-top:0; }
  .modal-card p.bullet{ padding-left:2px; }
  .modal-card p.bullet b{ color:var(--ink); }

  @media (max-width:420px){
    .dl-btn{ width:130px; }
    .stage{ padding-top:64px; }
  }
</style>
</head>

        <span id="iosText">iOS</span>
      </a>
      <a class="dl-btn dl-android" id="androidBtn" target="_blank" rel="noopener noreferrer">
        <span id="androidText">Android</span>
      </a>
    </div>

    <div class="divider"></div>

    <footer>
      <div class="dev-line" id="devEmail"></div>
      <div class="copyright" id="copyrightText"></div>
    </footer>

  </div>

  <!-- Game Background Modal -->
  <div class="modal-overlay" id="bgModal">
    <div class="modal-card">
      <button class="modal-close" id="bgClose">收起 ✕</button>
      <div class="modal-label" id="bgModalLabel">游戏背景</div>
      <div id="bgModalBody"></div>
    </div>
  </div>

  <!-- How to Play Modal -->
  <div class="modal-overlay" id="howModal">
    <div class="modal-card">
      <button class="modal-close" id="howClose">收起 ✕</button>
      <div class="modal-label" id="howModalLabel">玩法介绍</div>
      <div id="howModalBody"></div>
    </div>
  </div>

<script>
  const menuBtn = document.getElementById('menuBtn');
  const dropdownMenu = document.getElementById('dropdownMenu');
  const langBtn = document.getElementById('langBtn');
  const langBtnLabel = document.getElementById('langBtnLabel');
  const langDropdown = document.getElementById('langDropdown');
  const privacyLink = document.getElementById('privacyLink');
  const iosBtn = document.getElementById('iosBtn');
  const androidBtn = document.getElementById('androidBtn');

  const bgBtn = document.getElementById('bgBtn');
  const howBtn = document.getElementById('howBtn');
  const bgModal = document.getElementById('bgModal');
  const howModal = document.getElementById('howModal');
  const bgClose = document.getElementById('bgClose');
  const howClose = document.getElementById('howClose');

  // Supported languages
  const LANGS = ['zh-CN', 'zh-TW', 'en'];
  const LANG_NAMES = { 'zh-CN': '简体中文', 'zh-TW': '繁體中文', 'en': 'English' };

  const urlParams = new URLSearchParams(window.location.search);
  const langParam = urlParams.get('lang');

  function detectLang(){
    const nav = (navigator.language || '').toLowerCase();
    if (nav.startsWith('zh')) {
      // zh-TW, zh-HK, zh-Hant* -> Traditional; everything else zh-* -> Simplified
      if (nav.includes('tw') || nav.includes('hk') || nav.includes('hant')) return 'zh-TW';
      return 'zh-CN';
    }
    return 'en';
  }

  let currentLang = LANGS.includes(langParam) ? langParam : detectLang();

  const textData = {
    'zh-CN': {
      title: '摆麻将',
      tagline: '一款永远玩不腻的麻将配对消除游戏',
      bgBtnText: '游戏背景',
      howBtnText: '玩法介绍',
      dlLabel: '下载',
      iosText: 'iOS',
      androidText: 'Android',
      devEmail: "开发者：葛洪　联系邮箱：<a href='mailto:icesheetstudio@gmail.com'>icesheetstudio@gmail.com</a>",
      copyright: "© 2026 葛洪 / IceSheet Studio\n版权所有",
      privacyText: '🛡️ 隐私政策',
      appStoreLink: "https://apps.apple.com/app/baimahjong/id6749504746",
      playStoreLink: "https://play.google.com/store/apps/details?id=com.icesheetstudio.baimahjong",
      closeText: '收起 ✕',
      bgModalLabel: '游戏背景',
      bgModalBody: `
        <p>这是一款休闲麻将消除游戏，灵感来源于开发者奶奶每天都要玩的单人麻将游戏，老人家称之为"摆麻将"。</p>
        <p>作者致力于复刻这款经典麻将游戏，将其搬进数字世界。如果它能带给您快乐，欢迎分享给您的家人和朋友，让更多人一起享受《摆麻将》的乐趣。</p>
      `,
      howModalLabel: '玩法介绍',
      howModalBody: `
        <p class="bullet"><b>▸ 移动</b><br>点击并拖动麻将，相连的麻将会作为一个整体移动。</p>
        <p class="bullet"><b>▸ 消除</b><br>移动后，两个相同的麻将之间无阻挡时会自动消除。三张麻将同时可被消除时，它们会被标记，需手动选择其中一对进行消除。</p>
        <p class="bullet"><b>▸ 普通模式</b><br>没有时间压力，慢慢来，把所有麻将消除干净即可获胜。</p>
        <p class="bullet"><b>▸ 生存模式</b><br>初始100分，分数随时间流逝，消除加分，连续消除还有连击奖励，手速与眼力的双重考验。</p>
      `
    },
    'zh-TW': {
      title: '擺麻將',
      tagline: '一款永遠玩不膩的麻將配對消除遊戲',
      bgBtnText: '遊戲背景',
      howBtnText: '玩法介紹',
      dlLabel: '下載',
      iosText: 'iOS',
      androidText: 'Android',
      devEmail: "開發者：葛洪　聯絡信箱：<a href='mailto:icesheetstudio@gmail.com'>icesheetstudio@gmail.com</a>",
      copyright: "© 2026 葛洪 / IceSheet Studio\n版權所有",
      privacyText: '🛡️ 隱私政策',
      appStoreLink: "https://apps.apple.com/app/baimahjong/id6749504746",
      playStoreLink: "https://play.google.com/store/apps/details?id=com.icesheetstudio.baimahjong",
      closeText: '收起 ✕',
      bgModalLabel: '遊戲背景',
      bgModalBody: `
        <p>這是一款休閒麻將消除遊戲，靈感來源於開發者奶奶每天都要玩的單人麻將遊戲，老人家稱之為「擺麻將」。</p>
        <p>作者致力於復刻這款經典麻將遊戲，將其搬進數位世界。如果它能帶給您快樂，歡迎分享給您的家人和朋友，讓更多人一起享受《擺麻將》的樂趣。</p>
      `,
      howModalLabel: '玩法介紹',
      howModalBody: `
        <p class="bullet"><b>▸ 移動</b><br>點擊並拖動麻將，相連的麻將會作為一個整體移動。</p>
        <p class="bullet"><b>▸ 消除</b><br>移動後，兩個相同的麻將之間無阻擋時會自動消除。三張麻將同時可被消除時，它們會被標記，需手動選擇其中一對進行消除。</p>
        <p class="bullet"><b>▸ 普通模式</b><br>沒有時間壓力，慢慢來，把所有麻將消除乾淨即可獲勝。</p>
        <p class="bullet"><b>▸ 生存模式</b><br>初始100分，分數隨時間流逝，消除加分，連續消除還有連擊獎勵，手速與眼力的雙重考驗。</p>
      `
    },
    'en': {
      title: 'Bai Mahjong',
      tagline: 'A mahjong tile matching game you\u2019ll never get tired of',
      bgBtnText: 'Background',
      howBtnText: 'How to Play',
      dlLabel: 'Download',
      iosText: 'iOS',
      androidText: 'Android',
      devEmail: "Developer: Ge Hong&nbsp;&nbsp;&nbsp;Contact: <a href='mailto:icesheetstudio@gmail.com'>icesheetstudio@gmail.com</a>",
      copyright: "© 2026 Ge Hong / IceSheet Studio\nAll Rights Reserved",
      privacyText: '🛡️ Privacy Policy',
      appStoreLink: "https://apps.apple.com/app/baimahjong/id6749504746",
      playStoreLink: "https://play.google.com/store/apps/details?id=com.icesheetstudio.baimahjong",
      closeText: 'Close ✕',
      bgModalLabel: 'Game Background',
      bgModalBody: `
        <p>This is a relaxing Mahjong tile-matching game, inspired by the single-player Mahjong game that the developer's grandmother played daily, called "Bai Mahjong."</p>
        <p>The developer strives to faithfully recreate this classic Mahjong experience. If you enjoy it, feel free to share it with your family and friends so that more people can play Bai Mahjong.</p>
      `,
      howModalLabel: 'How to Play',
      howModalBody: `
        <p class="bullet"><b>▸ Move</b><br>Tap and drag a tile. Connected tiles move together as a single unit.</p>
        <p class="bullet"><b>▸ Match</b><br>After moving, if two identical tiles have a clear path between them, they clear automatically. If three identical tiles are eligible, they will be highlighted, and you can choose which pair to clear.</p>
        <p class="bullet"><b>▸ Classic Mode</b><br>No timer, no pressure. Clear the board at your own pace.</p>
        <p class="bullet"><b>▸ Survival Mode</b><br>Start with 100 points, watch the clock tick, and rack up combos as you clear.</p>
      `
    }
  };

  function renderText(lang){
    const t = textData[lang];
    document.getElementById('title').textContent = t.title;
    document.getElementById('tagline').innerHTML = t.tagline;
    document.getElementById('bgBtnText').textContent = t.bgBtnText;
    document.getElementById('howBtnText').textContent = t.howBtnText;
    document.getElementById('dlLabel').textContent = t.dlLabel;
    document.getElementById('iosText').textContent = t.iosText;
    document.getElementById('androidText').textContent = t.androidText;
    document.getElementById('devEmail').innerHTML = t.devEmail;
    document.getElementById('copyrightText').textContent = t.copyright;
    iosBtn.href = t.appStoreLink;
    androidBtn.href = t.playStoreLink;
    privacyLink.textContent = t.privacyText;
    privacyLink.href = 'privacy.html?lang=' + lang;
    bgClose.textContent = t.closeText;
    howClose.textContent = t.closeText;
    document.getElementById('bgModalLabel').textContent = t.bgModalLabel;
    document.getElementById('bgModalBody').innerHTML = t.bgModalBody;
    document.getElementById('howModalLabel').textContent = t.howModalLabel;
    document.getElementById('howModalBody').innerHTML = t.howModalBody;
    document.documentElement.lang = lang;

    // language button + menu reflect the *current* language directly
    langBtnLabel.textContent = LANG_NAMES[lang];
    langDropdown.querySelectorAll('button[data-lang]').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.lang === lang);
    });
  }

  renderText(currentLang);

  function selectLang(lang){
    if (lang === currentLang) { langDropdown.style.display = 'none'; return; }
    currentLang = lang;
    renderText(currentLang);
    const newUrl = window.location.pathname + '?lang=' + currentLang;
    window.history.replaceState({}, '', newUrl);
    langDropdown.style.display = 'none';
  }

  menuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    langDropdown.style.display = 'none';
    dropdownMenu.style.display = dropdownMenu.style.display === 'block' ? 'none' : 'block';
  });

  langBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    dropdownMenu.style.display = 'none';
    const willOpen = langDropdown.style.display !== 'block';
    langDropdown.style.display = willOpen ? 'block' : 'none';
    langBtn.setAttribute('aria-expanded', String(willOpen));
  });

  langDropdown.querySelectorAll('button[data-lang]').forEach(btn => {
    btn.addEventListener('click', () => selectLang(btn.dataset.lang));
  });

  document.addEventListener('click', e => {
    if (!menuBtn.contains(e.target) && !dropdownMenu.contains(e.target)) {
      dropdownMenu.style.display = 'none';
    }
    if (!langBtn.contains(e.target) && !langDropdown.contains(e.target)) {
      langDropdown.style.display = 'none';
      langBtn.setAttribute('aria-expanded', 'false');
    }
  });

  function openModal(modal){ modal.classList.add('open'); }
  function closeModal(modal){ modal.classList.remove('open'); }

  bgBtn.addEventListener('click', () => openModal(bgModal));
  howBtn.addEventListener('click', () => openModal(howModal));
  bgClose.addEventListener('click', () => closeModal(bgModal));
  howClose.addEventListener('click', () => closeModal(howModal));

  [bgModal, howModal].forEach(modal => {
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal(modal);
    });
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeModal(bgModal); closeModal(howModal); }
  });
</script>

</body>
</html>
