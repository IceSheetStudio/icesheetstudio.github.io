<script>
const menuBtn = document.getElementById('menuBtn');
const dropdownMenu = document.getElementById('dropdownMenu');
const langToggle = document.getElementById('langToggle');
const privacyLink = document.getElementById('privacyLink');
const downloadBtn = document.getElementById('downloadBtn');

// --- 核心修改：移除 localStorage，改为纯内存变量 ---
let currentLang = 'en'; 
// 根据系统语言自动判断，但不存储
const userLang = (navigator.language || '').toLowerCase();
if (userLang.startsWith('zh')) {
    currentLang = 'zh-CN';
}

const textData = {
    'zh-CN': {
        title: '摆麻将',
        downloadText: '在 App Store 打开',
        devEmail: `<span>开发者：葛洪</span><span>📧 联系邮箱：<a href="mailto:gehong01@gmail.com">gehong01@gmail.com</a></span>`,
        gameDesc: `<p>游戏背景：</p><p>这款游戏由独立开发者葛洪制作，灵感来源于作者奶奶每天都要玩的单人麻将游戏，老人家称之为“摆麻将”。</p><p>作者致力于复刻这款经典麻将游戏，将其搬进数字世界。如果它能带给您快乐，欢迎分享给您的家人和朋友，让更多人一起享受《摆麻将》的乐趣。</p>`,
        footer: `© 2026 Ge Hong / IceSheet Studio\n版权所有`,
        btnText: '🌐 English',
        privacyText: '🛡️ 隐私政策',
        appStoreLink: "https://apps.apple.com/app/baimahjong/id6749504746"
    },
    'en': {
        title: 'Bai Mahjong',
        downloadText: 'Open in App Store',
        devEmail: `<span>Developer: Ge Hong</span><span>📧 Contact Email: <a href="mailto:gehong01@gmail.com">gehong01@gmail.com</a></span>`,
        gameDesc: `<p>Game Background：</p><p>This game was independently developed by Ge Hong, inspired by the single-player Mahjong game that his grandmother played daily, called "Bai Mahjong."</p><p>The developer strives to faithfully recreate this classic Mahjong experience. If you enjoy it, feel free to share it with your family and friends so that more people can play Bai Mahjong.</p>`,
        footer: `© 2026 Ge Hong / IceSheet Studio\nAll Rights Reserved`,
        btnText: '🌐 中文',
        privacyText: '🛡️ Privacy Policy',
        appStoreLink: "https://apps.apple.com/app/baimahjong/id6749504746"
    }
};

function renderText(lang){
    document.getElementById('title').innerHTML = textData[lang].title;
    document.getElementById('gameDesc').innerHTML = textData[lang].gameDesc;
    document.getElementById('devEmail').innerHTML = textData[lang].devEmail;
    downloadBtn.textContent = textData[lang].downloadText;
    downloadBtn.href = textData[lang].appStoreLink;
    langToggle.textContent = textData[lang].btnText;
    privacyLink.textContent = textData[lang].privacyText;
    document.getElementById('footer').textContent = textData[lang].footer;
}

renderText(currentLang);

menuBtn.addEventListener('click', ()=> { 
    dropdownMenu.style.display = dropdownMenu.style.display==='block'?'none':'block'; 
});

langToggle.addEventListener('click', e=>{ 
    e.preventDefault(); 
    currentLang = currentLang==='zh-CN'?'en':'zh-CN'; 
    // --- 核心修改：删除了 localStorage.setItem ---
    renderText(currentLang); 
    dropdownMenu.style.display='none'; 
});

document.addEventListener('click', e=>{ 
    if(!menuBtn.contains(e.target) && !dropdownMenu.contains(e.target)){ 
        dropdownMenu.style.display='none'; 
    } 
});
</script>
