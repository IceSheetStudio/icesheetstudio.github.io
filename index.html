<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>摆麻将 · Bai Mahjong</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#12141a;
    --bg-1:#181c1c;
    --jade:#3e8e5c;
    --jade-dark:#1f3a2a;
    --blue:#0a84ff;
    --blue-dark:#0066cc;
    --ivory:#f4eee0;
    --ivory-dim:#e9e1cd;
    --ink:#3a2a20;
    --red:#c5382a;
    --red-dark:#8e281e;
    --gold:#c9a227;
    --muted:#8b9199;
    --muted-2:#5c6167;
    --line: rgba(244,238,224,0.10);
    --shadow-deep: rgba(0,0,0,0.55);
  }

  *{box-sizing:border-box;}

  html,body{ margin:0; padding:0; min-height:100%; }

  body{
    background:
      radial-gradient(ellipse 900px 600px at 50% -10%, rgba(62,142,92,0.16), transparent 60%),
      linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%);
    color:var(--ivory);
    font-family:'Noto Sans SC', sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  .sparkle{
    position:fixed;
    width:5px;height:5px;
    background:var(--gold);
    clip-path: polygon(50% 0%, 63% 38%, 100% 50%, 63% 62%, 50% 100%, 37% 62%, 0% 50%, 37% 38%);
    opacity:0.55;
    animation: twinkle 4.5s ease-in-out infinite;
    pointer-events:none;
  }
  .s1{ top:14%; left:12%; animation-delay:0s; }
  .s2{ top:70%; left:8%;  width:3px; height:3px; animation-delay:1.2s; }
  .s3{ top:22%; left:88%; animation-delay:.6s; }
  .s4{ top:78%; left:90%; width:4px; height:4px; animation-delay:2s; }
  .s5{ top:48%; left:5%;  width:3px; height:3px; animation-delay:3s; }

  @keyframes twinkle{
    0%, 100%{ opacity:0.15; transform:scale(0.8); }
    50%{ opacity:0.8; transform:scale(1.15); }
  }
  @media (prefers-reduced-motion: reduce){ .sparkle{ animation:none; opacity:0.35; } }

  /* ---------- top-right menu ---------- */
  .menu-btn{
    position:fixed;
    top:18px; right:18px;
    width:38px; height:38px;
    border-radius:10px;
    border:1px solid var(--line);
    background:rgba(244,238,224,0.05);
    color:var(--ivory);
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
    cursor:pointer;
    z-index:1000;
    transition: background .2s ease, transform .15s ease;
  }
  .menu-btn:hover{ background:rgba(244,238,224,0.1); }
  .menu-btn:active{ transform:scale(0.95); }

  .dropdown-menu{
    display:none;
    position:fixed;
    top:62px; right:18px;
    background:#1b1f1f;
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    min-width:180px;
    box-shadow:0 14px 32px -8px var(--shadow-deep);
    z-index:1000;
  }
  .dropdown-menu a{
    display:block;
    padding:12px 16px;
    text-align:left;
    color:var(--ivory-dim);
    text-decoration:none;
    font-size:14.5px;
    border-bottom:1px solid var(--line);
    transition: background .15s ease, color .15s ease;
  }
  .dropdown-menu a:last-child{ border-bottom:none; }
  .dropdown-menu a:hover{ background:rgba(62,142,92,0.16); color:var(--ivory); }

  /* ---------- language switcher ---------- */
  .lang-btn{
    position:fixed;
    top:18px; right:66px;
    height:38px;
    padding:0 12px;
    border-radius:10px;
    border:1px solid var(--line);
    background:rgba(244,238,224,0.05);
    color:var(--ivory);
    display:flex; align-items:center; gap:6px;
    font-size:13.5px;
    font-weight:500;
    cursor:pointer;
    z-index:1000;
    transition: background .2s ease, transform .15s ease;
    white-space:nowrap;
  }
  .lang-btn:hover{ background:rgba(244,238,224,0.1); }
  .lang-btn:active{ transform:scale(0.96); }
  .lang-btn .lang-icon{ font-size:15px; line-height:1; }
  /* Show only the globe on the main button; language names stay in the dropdown. */
  .lang-btn .lang-label{ display:none; }
  .lang-btn{ width:38px; padding:0; justify-content:center; }

  .lang-dropdown{
    display:none;
    position:fixed;
    top:62px; right:66px;
    background:#1b1f1f;
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    min-width:150px;
    box-shadow:0 14px 32px -8px var(--shadow-deep);
    z-index:1000;
  }
  .lang-dropdown button{
    all:unset;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    padding:12px 16px;
    text-align:left;
    color:var(--ivory-dim);
    font-size:14.5px;
    font-family:inherit;
    cursor:pointer;
    border-bottom:1px solid var(--line);
    transition: background .15s ease, color .15s ease;
  }
  .lang-dropdown button:last-child{ border-bottom:none; }
  .lang-dropdown button:hover{ background:rgba(62,142,92,0.16); color:var(--ivory); }
  .lang-dropdown button.active{ color:var(--gold); font-weight:600; }
  .lang-dropdown button .check{ opacity:0; font-size:12px; }
  .lang-dropdown button.active .check{ opacity:1; }

  @media (max-width:380px){
    .lang-btn span.lang-label{ display:none; }
    .lang-btn{ padding:0; width:38px; justify-content:center; }
    .lang-dropdown{ right:62px; }
  }

  /* ---------- stage ---------- */
  .stage{
    width:100%;
    max-width:520px;
    margin:0 auto;
    padding:72px 28px 48px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .logo{
    width:96px;
    height:96px;
    border-radius:24px;
    overflow:hidden;
    box-shadow:
      0 0 0 1px rgba(244,238,224,0.06),
      0 16px 34px -8px rgba(0,0,0,0.65),
      0 0 50px -12px rgba(62,142,92,0.45);
    margin-bottom:20px;
    animation: rise .7s cubic-bezier(.2,.8,.2,1) both;
  }
  .logo img{ width:100%; height:100%; display:block; object-fit:cover; }

  h1.title{
    font-family:'Noto Serif SC', serif;
    font-weight:900;
    font-size:clamp(34px, 8vw, 44px);
    letter-spacing:0.06em;
    margin:0 0 8px;
    background: linear-gradient(180deg, var(--ivory) 0%, var(--ivory-dim) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation: rise .7s .05s cubic-bezier(.2,.8,.2,1) both;
  }

  .tagline{
    font-size:14px;
    color:var(--muted);
    letter-spacing:0.02em;
    margin:0 0 32px;
    animation: rise .7s .1s cubic-bezier(.2,.8,.2,1) both;
  }
  .tagline b{ color:var(--gold); font-weight:600; }

  @keyframes rise{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* ---------- info pills (replaces oversized flip tile) ---------- */
  .info-row{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom:36px;
    animation: rise .7s .15s cubic-bezier(.2,.8,.2,1) both;
  }

  .info-pill{
    all:unset;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
    padding:12px 20px;
    border-radius:999px;
    background:rgba(244,238,224,0.05);
    border:1px solid var(--line);
    color:var(--ivory-dim);
    font-size:14.5px;
    font-weight:500;
    letter-spacing:0.01em;
    transition: background .2s ease, transform .15s ease, border-color .2s ease;
  }
  .info-pill:hover{ background:rgba(62,142,92,0.14); border-color:rgba(62,142,92,0.4); }
  .info-pill:active{ transform:scale(0.97); }
  .info-pill .pill-icon{ font-size:16px; line-height:1; }

  /* ---------- download section ---------- */
  .dl-label{
    font-size:12px;
    letter-spacing:0.14em;
    color:var(--muted-2);
    text-transform:uppercase;
    margin-bottom:12px;
    animation: rise .7s .18s cubic-bezier(.2,.8,.2,1) both;
  }

  .downloads{
    display:flex;
    gap:14px;
    margin-bottom:14px;
    animation: rise .7s .2s cubic-bezier(.2,.8,.2,1) both;
  }

  .dl-btn{
    all:unset;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    width:150px;
    padding:13px 0 11px;
    border-radius:13px;
    font-size:15.5px;
    font-weight:600;
    letter-spacing:0.02em;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .dl-btn:active{ transform: translateY(1px) scale(0.98); }

  .dl-ios{
    background: linear-gradient(180deg, #2b98ff, var(--blue));
    color:#eaf4ff;
    box-shadow: 0 10px 22px -8px rgba(10,132,255,0.55), inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .dl-ios:hover{ box-shadow: 0 12px 26px -8px rgba(10,132,255,0.7), inset 0 1px 0 rgba(255,255,255,0.3); }

  .dl-android{
    background: linear-gradient(180deg, #4aa06e, var(--jade));
    color:#0e1a13;
    box-shadow: 0 10px 22px -8px rgba(62,142,92,0.55), inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .dl-android:hover{ box-shadow: 0 12px 26px -8px rgba(62,142,92,0.7), inset 0 1px 0 rgba(255,255,255,0.3); }

  .dl-icon{ font-size:13px; letter-spacing:0.06em; opacity:0.9; }
  .dl-sub{
    font-size:10.5px;
    font-weight:400;
    letter-spacing:0.08em;
    margin-top:2px;
    opacity:0.75;
  }

  .divider{
    width:36px;
    height:1px;
    background: rgba(244,238,224,0.14);
    margin: 30px 0 22px;
    animation: rise .7s .25s cubic-bezier(.2,.8,.2,1) both;
  }

  footer{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    font-size:12.5px;
    color:var(--muted-2);
    animation: rise .7s .3s cubic-bezier(.2,.8,.2,1) both;
  }
  footer a{ color:var(--gold); text-decoration:none; }
  footer a:hover{ color:#e0bb3a; }
  .copyright{ opacity:0.7; white-space:pre-line; }

  /* ---------- modal ---------- */
  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(10,12,12,0.66);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index:2000;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .modal-overlay.open{ display:flex; }

  .modal-card{
    width:100%;
    max-width:440px;
    max-height:80vh;
    overflow-y:auto;
    background: linear-gradient(155deg, var(--ivory) 0%, var(--ivory-dim) 100%);
    border-radius:20px;
    padding:30px 28px 26px;
    text-align:left;
    color:var(--ink);
    box-shadow: 0 24px 60px -10px rgba(0,0,0,0.6);
    position:relative;
    animation: pop .28s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes pop{
    from{ opacity:0; transform:translateY(12px) scale(0.97); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  .modal-close{
    position:absolute;
    top:14px; right:16px;
    font-size:12px;
    color:var(--muted-2);
    letter-spacing:0.05em;
    cursor:pointer;
    background:none;
    border:none;
    font-family:inherit;
  }

  .modal-label{
    font-size:12px;
    letter-spacing:0.16em;
    color:var(--red-dark);
    font-weight:700;
    margin-bottom:14px;
    text-transform:uppercase;
  }

  .modal-card p{ margin:0 0 12px; font-size:14px; line-height:1.85; color:var(--ink); }
  .modal-card p:last-child{ margin-bottom:0; }
  .modal-card p.section-head{ font-weight:700; color:var(--ink); margin-top:16px; margin-bottom:6px; }
  .modal-card p.section-head:first-child{ margin-top:0; }
  .modal-card p.bullet{ padding-left:2px; }
  .modal-card p.bullet b{ color:var(--ink); }

  @media (max-width:420px){
    .dl-btn{ width:130px; }
    .stage{ padding-top:64px; }
  }
</style>
</head>
<body>

  <span class="sparkle s1"></span>
  <span class="sparkle s2"></span>
  <span class="sparkle s3"></span>
  <span class="sparkle s4"></span>
  <span class="sparkle s5"></span>

  <button class="lang-btn" id="langBtn" aria-label="language" aria-haspopup="true" aria-expanded="false">
    <span class="lang-icon">🌐</span><span class="lang-label" id="langBtnLabel">简体中文</span>
  </button>
  <div class="lang-dropdown" id="langDropdown" role="menu">
    <button type="button" data-lang="zh-CN" role="menuitemradio"><span>简体中文</span><span class="check">✓</span></button>
    <button type="button" data-lang="zh-TW" role="menuitemradio"><span>繁體中文</span><span class="check">✓</span></button>

  </div>

  <button class="menu-btn" id="menuBtn" aria-label="menu">☰</button>
  <div class="dropdown-menu" id="dropdownMenu">
    <a href="privacy.html?lang=zh-CN" id="privacyLink">🛡️ 隐私政策</a>
  </div>

  function renderText(lang){
    const t = textData[lang];
    document.getElementById('title').textContent = t.title;
    document.getElementById('tagline').innerHTML = t.tagline;
    document.getElementById('bgBtnText').textContent = t.bgBtnText;
    document.getElementById('howBtnText').textContent = t.howBtnText;
    document.getElementById('dlLabel').textContent = t.dlLabel;
    document.getElementById('iosText').textContent = t.iosText;
    document.getElementById('androidText').textContent = t.androidText;
    document.getElementById('devEmail').innerHTML = t.devEmail;
    document.getElementById('copyrightText').textContent = t.copyright;
    iosBtn.href = t.appStoreLink;
    androidBtn.href = t.playStoreLink;
    privacyLink.textContent = t.privacyText;
    privacyLink.href = 'privacy.html?lang=' + lang;
    bgClose.textContent = t.closeText;
    howClose.textContent = t.closeText;
    document.getElementById('bgModalLabel').textContent = t.bgModalLabel;
    document.getElementById('bgModalBody').innerHTML = t.bgModalBody;
    document.getElementById('howModalLabel').textContent = t.howModalLabel;
    document.getElementById('howModalBody').innerHTML = t.howModalBody;
    document.documentElement.lang = lang;

    // language button + menu reflect the *current* language directly
    langBtnLabel.textContent = LANG_NAMES[lang];
    langDropdown.querySelectorAll('button[data-lang]').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.lang === lang);
    });
  }

  renderText(currentLang);

  function selectLang(lang){
    if (lang === currentLang) { langDropdown.style.display = 'none'; return; }
    currentLang = lang;
    renderText(currentLang);
    const newUrl = window.location.pathname + '?lang=' + currentLang;
    window.history.replaceState({}, '', newUrl);
    langDropdown.style.display = 'none';
  }

  menuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    langDropdown.style.display = 'none';
    dropdownMenu.style.display = dropdownMenu.style.display === 'block' ? 'none' : 'block';
  });

  langBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    dropdownMenu.style.display = 'none';
    const willOpen = langDropdown.style.display !== 'block';
    langDropdown.style.display = willOpen ? 'block' : 'none';
    langBtn.setAttribute('aria-expanded', String(willOpen));
  });

  langDropdown.querySelectorAll('button[data-lang]').forEach(btn => {
    btn.addEventListener('click', () => selectLang(btn.dataset.lang));
  });

  document.addEventListener('click', e => {
    if (!menuBtn.contains(e.target) && !dropdownMenu.contains(e.target)) {
      dropdownMenu.style.display = 'none';
    }
    if (!langBtn.contains(e.target) && !langDropdown.contains(e.target)) {
      langDropdown.style.display = 'none';
      langBtn.setAttribute('aria-expanded', 'false');
    }
  });

  function openModal(modal){ modal.classList.add('open'); }
  function closeModal(modal){ modal.classList.remove('open'); }

  bgBtn.addEventListener('click', () => openModal(bgModal));
  howBtn.addEventListener('click', () => openModal(howModal));
  bgClose.addEventListener('click', () => closeModal(bgModal));
  howClose.addEventListener('click', () => closeModal(howModal));

  [bgModal, howModal].forEach(modal => {
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal(modal);
    });
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeModal(bgModal); closeModal(howModal); }
  });
