<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bai Mahjong - Privacy Policy</title>
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #2c2c2e;
        color: #f2f2f2;
        text-align: center;
        padding: 60px 20px;
        line-height: 1.7;
        transition: all 0.3s;
    }

    h1 {
        font-size: 2em;
        margin-bottom: 0.3em;
    }

    .effective-date {
        color: #bbb;
        margin-bottom: 2em;
        font-size: 0.95em;
    }

    a {
        color: #0a84ff;
        text-decoration: none;
    }

    a:hover {
        text-decoration: underline;
    }

    .lang-btn {
        position: fixed;
        top: 20px;
        right: 20px;
        background: #0a84ff;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 6px 10px;
        cursor: pointer;
        font-size: 0.9em;
        transition: background 0.3s;
        z-index: 1000;
    }

    .lang-btn:hover {
        background: #0066cc;
    }

    .policy-content {
        background: #3a3a3c;
        padding: 25px 30px;
        border-radius: 12px;
        margin: 20px auto;
        max-width: 800px;
        text-align: left;
    }

    .policy-content h3 {
        color: #f2f2f2;
        margin-top: 1.8em;
    }

    .policy-content p, .policy-content li {
        color: #ddd;
    }

    .policy-content ul {
        margin-left: 20px;
    }

    footer {
        margin-top: 40px;
        font-size: 0.9em;
        color: #aaa;
        text-align: center;
    }

    @media (max-width: 600px) {
        .policy-content {
            padding: 20px 15px;
        }
    }
</style>
</head>
<body>

<button class="lang-btn" id="langBtn"></button>

<h1 id="title"></h1>
<div class="effective-date" id="effectiveDate"></div>

<div class="policy-content" id="policyContent"></div>

<footer id="footer"></footer>

<script>
const langBtn = document.getElementById('langBtn');

// 默认主语言英文
let currentLang = 'en';

// 自动识别浏览器语言，中文显示简体
const userLang = (navigator.language || navigator.userLanguage).toLowerCase();
if(userLang.startsWith('zh')) currentLang = 'zh-CN';

// 数据
const policyData = {
    "zh-CN": {
        title: '摆麻将 - 隐私政策',
        effectiveDate: '生效日期：2026 年 2 月 21 日',
        footer: '© 2026 葛洪 · 版权所有',
        btn: '🌐 English',
        content: `
<h3>1. 信息收集与使用</h3>
<ul>
<li><strong>不收集个人身份信息：</strong>我们不会主动收集、存储或上传您的姓名、电子邮件、电话号码或地理位置等个人可识别信息（PII）。</li>
<li><strong>本地数据存储：</strong>您的游戏进度和本地设置仅存储在您的设备中。</li>
</ul>

<h3>2. 第三方广告服务</h3>
<ul>
<li><strong>Google AdMob：</strong>
    <ul>
        <li><strong>数据收集：</strong>AdMob 可能收集匿名技术信息，包括设备标识符（如 IDFA，仅在您授权后）、IP 地址及广告互动数据。</li>
        <li><strong>用途：</strong>仅用于广告展示、频次控制、反欺诈和匿名统计。</li>
        <li><strong>用户控制：</strong>支持 iOS 的“要求 App 不跟踪”（App Tracking Transparency）。拒绝授权后，AdMob 不会访问您的 IDFA 进行跨应用追踪。</li>
        <li>详细请参阅 <a href="https://policies.google.com/privacy" target="_blank">Google 隐私政策</a>。</li>
    </ul>
</li>
</ul>

<h3>3. Game Center 数据</h3>
<p>本游戏通过 Apple Game Center 提供排行榜和成就系统。相关数据（如游戏昵称和分数）由 Apple 管理，我们无法访问您的 Apple ID 或个人信息。详情请参阅 <a href="https://www.apple.com/legal/privacy/" target="_blank">Apple 隐私政策</a>。</p>

<h3>4. 设备权限说明</h3>
<ul>
<li><strong>网络访问权限：</strong>用于加载广告内容以及同步 Game Center 排行榜积分。</li>
<li><strong>App 追踪透明度 (ATT)：</strong>用于请求广告追踪授权，以展示更相关的广告。</li>
</ul>

<h3>5. 数据安全与保留</h3>
<ul>
<li>不设立云端服务器，因此<strong>不收集也不存储</strong>用户个人数据在服务器上。</li>
<li>游戏记录随 App 卸载即物理删除。第三方服务的数据保留请参照官方隐私协议。</li>
</ul>

<h3>6. 未成年人保护</h3>
<ul>
<li>游戏适合所有年龄，不包含 IAP 或社交聊天功能。</li>
<li>不鼓励或引导未成年人提供个人信息，遵守儿童隐私保护法规（13 岁以下儿童特别保护）。</li>
</ul>

<h3>7. 政策更新</h3>
<p>若未来版本引入新的功能或服务，我们将更新本政策并在本页面发布，建议您定期查看。</p>

<h3>8. 联系我们</h3>
<p>开发者：葛洪<br>邮箱：<a href="mailto:gehong01@gmail.com">gehong01@gmail.com</a></p>
`
    },
    "en": {
        title: 'Bai Mahjong - Privacy Policy',
        effectiveDate: 'Effective Date: February 21, 2026',
        footer: '© 2026 Ge Hong · All Rights Reserved',
        btn: '🌐 中文',
        content: `
<h3>1. Information Collection and Use</h3>
<ul>
<li><strong>No Collection of PII:</strong> We do not collect, store, or upload personally identifiable information such as name, email, phone number, or location.</li>
<li><strong>Local Data Storage:</strong> Game progress and settings are stored locally on your device only.</li>
</ul>

<h3>2. Third-Party Advertising Service</h3>
<ul>
<li><strong>Google AdMob:</strong>
    <ul>
        <li><strong>Data Collection:</strong> AdMob may collect anonymous technical info, including device identifiers (IDFA, with consent), IP addresses, and ad interaction data.</li>
        <li><strong>Purpose:</strong> Ad delivery, frequency capping, fraud prevention, and anonymous analytics.</li>
        <li><strong>User Control:</strong> Supports iOS App Tracking Transparency (ATT). If denied, AdMob will not access IDFA for cross-app tracking.</li>
        <li>See also <a href="https://policies.google.com/privacy" target="_blank">Google Privacy Policy</a>.</li>
    </ul>
</li>
</ul>

<h3>3. Game Center Data</h3>
<p>The game uses Apple Game Center to provide leaderboards and achievements. Data such as nicknames and scores is managed by Apple. We do not have access to your Apple ID or personal information. See <a href="https://www.apple.com/legal/privacy/" target="_blank">Apple Privacy Policy</a>.</p>

<h3>4. Device Permissions</h3>
<ul>
<li><strong>Network Access:</strong> For loading ads and syncing Game Center scores.</li>
<li><strong>App Tracking Transparency (ATT):</strong> To request ad tracking permission for more relevant ads.</li>
</ul>

<h3>5. Data Security and Retention</h3>
<ul>
<li>No cloud servers; <strong>we do not collect or store</strong> user personal data on our servers.</li>
<li>Game data is deleted when the app is uninstalled. Third-party retention policies apply.</li>
</ul>

<h3>6. Protection of Minors</h3>
<ul>
<li>Game suitable for all ages; no IAP or social chat.</li>
<li>No collection of personal data from children under 13; complies with applicable child privacy regulations.</li>
</ul>

<h3>7. Policy Updates</h3>
<p>This policy may be updated with new features or legal requirements and will be posted on this page. Check periodically for updates.</p>

<h3>8. Contact</h3>
<p>Developer: Ge Hong<br>Email: <a href="mailto:gehong01@gmail.com">gehong01@gmail.com</a></p>
`
    }
};

// 渲染函数
function renderPolicy(lang) {
    document.getElementById('title').textContent = policyData[lang].title;
    document.getElementById('effectiveDate').textContent = policyData[lang].effectiveDate;
    document.getElementById('policyContent').innerHTML = policyData[lang].content;
    document.getElementById('footer').textContent = policyData[lang].footer;
    langBtn.textContent = policyData[lang].btn;
}

// 初始渲染
renderPolicy(currentLang);

// 手动切换语言
langBtn.addEventListener('click', () => {
    currentLang = currentLang === 'zh-CN' ? 'en' : 'zh-CN';
    renderPolicy(currentLang);
});
</script>

</body>
</html>
