<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>摆麻将 · 隐私政策</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --bg-0:#12141a;
    --bg-1:#181c1c;
    --jade:#3e8e5c;
    --jade-dark:#1f3a2a;
    --blue:#0a84ff;
    --blue-dark:#0066cc;
    --ivory:#f4eee0;
    --ivory-dim:#e9e1cd;
    --ink:#3a2a20;
    --red:#c5382a;
    --red-dark:#8e281e;
    --gold:#c9a227;
    --muted:#8b9199;
    --muted-2:#5c6167;
    --line: rgba(244,238,224,0.10);
    --shadow-deep: rgba(0,0,0,0.55);
  }

  *{box-sizing:border-box;}

  html,body{ margin:0; padding:0; min-height:100%; }

  body{
    background:
      radial-gradient(ellipse 900px 600px at 50% -10%, rgba(62,142,92,0.16), transparent 60%),
      linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%);
    color:var(--ivory);
    font-family:'Noto Sans SC', sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  /* ---------- top-right menu ---------- */
  .menu-btn{
    position:fixed;
    top:18px; right:18px;
    width:38px; height:38px;
    border-radius:10px;
    border:1px solid var(--line);
    background:rgba(244,238,224,0.05);
    color:var(--ivory);
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
    cursor:pointer;
    z-index:1000;
    transition: background .2s ease, transform .15s ease;
  }
  .menu-btn:hover{ background:rgba(244,238,224,0.1); }
  .menu-btn:active{ transform:scale(0.95); }

  .dropdown-menu{
    display:none;
    position:fixed;
    top:62px; right:18px;
    background:#1b1f1f;
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    min-width:180px;
    box-shadow:0 14px 32px -8px var(--shadow-deep);
    z-index:1000;
  }
  .dropdown-menu a{
    display:block;
    padding:12px 16px;
    text-align:left;
    color:var(--ivory-dim);
    text-decoration:none;
    font-size:14.5px;
    border-bottom:1px solid var(--line);
    transition: background .15s ease, color .15s ease;
  }
  .dropdown-menu a:last-child{ border-bottom:none; }
  .dropdown-menu a:hover{ background:rgba(62,142,92,0.16); color:var(--ivory); }

  /* ---------- language switcher ---------- */
  .lang-btn{
    position:fixed;
    top:18px; right:66px;
    width:38px; height:38px;
    padding:0;
    border-radius:10px;
    border:1px solid var(--line);
    background:rgba(244,238,224,0.05);
    color:var(--ivory);
    display:flex; align-items:center; justify-content:center;
    font-size:15px;
    font-weight:500;
    cursor:pointer;
    z-index:1000;
    transition: background .2s ease, transform .15s ease;
    white-space:nowrap;
  }
  .lang-btn:hover{ background:rgba(244,238,224,0.1); }
  .lang-btn:active{ transform:scale(0.96); }
  .lang-btn .lang-icon{ font-size:15px; line-height:1; }

  .lang-dropdown{
    display:none;
    position:fixed;
    top:62px; right:66px;
    background:#1b1f1f;
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    min-width:150px;
    box-shadow:0 14px 32px -8px var(--shadow-deep);
    z-index:1000;
  }
  .lang-dropdown button{
    all:unset;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    padding:12px 16px;
    text-align:left;
    color:var(--ivory-dim);
    font-size:14.5px;
    font-family:inherit;
    cursor:pointer;
    border-bottom:1px solid var(--line);
    transition: background .15s ease, color .15s ease;
  }
  .lang-dropdown button:last-child{ border-bottom:none; }
  .lang-dropdown button:hover{ background:rgba(62,142,92,0.16); color:var(--ivory); }
  .lang-dropdown button.active{ color:var(--gold); font-weight:600; }
  .lang-dropdown button .check{ opacity:0; font-size:12px; }
  .lang-dropdown button.active .check{ opacity:1; }

  /* ---------- stage ---------- */
  .stage{
    width:100%;
    max-width:720px;
    margin:0 auto;
    padding:80px 24px 56px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  h1.title{
    font-family:'Noto Serif SC', serif;
    font-weight:900;
    font-size:clamp(26px, 6vw, 34px);
    letter-spacing:0.04em;
    margin:0 0 10px;
    background: linear-gradient(180deg, var(--ivory) 0%, var(--ivory-dim) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation: rise .7s cubic-bezier(.2,.8,.2,1) both;
  }

  .effective-date{
    font-size:13px;
    color:var(--muted);
    letter-spacing:0.02em;
    margin:0 0 36px;
    animation: rise .7s .05s cubic-bezier(.2,.8,.2,1) both;
  }

  @keyframes rise{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* ---------- policy card ---------- */
  .policy-card{
    width:100%;
    text-align:left;
    background: rgba(244,238,224,0.03);
    border:1px solid var(--line);
    border-radius:16px;
    padding:36px 34px 30px;
    color:var(--muted);
    box-shadow: 0 24px 60px -10px rgba(0,0,0,0.55);
    animation: rise .7s .1s cubic-bezier(.2,.8,.2,1) both;
  }

  .policy-card h3{
    font-family:'Noto Sans SC', sans-serif;
    font-size:14.5px;
    font-weight:600;
    color:var(--ivory-dim);
    letter-spacing:0.02em;
    margin:26px 0 10px;
    padding-bottom:8px;
    border-bottom:1px solid var(--line);
  }
  .policy-card h3:first-child{ margin-top:0; }

  .policy-card ul{
    margin:0 0 4px;
    padding-left:20px;
  }
  .policy-card li{
    font-size:13.5px;
    line-height:1.9;
    color:var(--muted);
    margin-bottom:12px;
  }
  .policy-card li:last-child{ margin-bottom:0; }
  .policy-card a{ color:var(--blue); text-decoration:underline; text-underline-offset:2px; }
  .policy-card a:hover{ color:#3fa0ff; }
  .policy-card strong{ color:var(--ivory-dim); font-weight:600; }

  .divider{
    width:36px;
    height:1px;
    background: rgba(244,238,224,0.14);
    margin: 34px 0 22px;
  }

  footer{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    font-size:12.5px;
    color:var(--muted-2);
  }
  .copyright{ opacity:0.7; white-space:pre-line; text-align:center; }

  @media (max-width:420px){
    .stage{ padding-top:72px; }
    .policy-card{ padding:28px 22px 24px; }
  }
</style>
</head>
<body>

  <button class="lang-btn" id="langBtn" aria-label="language" aria-haspopup="true" aria-expanded="false">

  function detectLang(){
    const nav = (navigator.language || '').toLowerCase();
    if (nav.startsWith('zh')) {
      if (nav.includes('tw') || nav.includes('hk') || nav.includes('hant')) return 'zh-TW';
      return 'zh-CN';
    }
    return 'en';
  }

  const urlParams = new URLSearchParams(window.location.search);
  const langParam = urlParams.get('lang');
  let currentLang = LANGS.includes(langParam) ? langParam : detectLang();

  function renderText(lang){
    const t = policyData[lang];
    document.getElementById('title').textContent = t.title;
    document.getElementById('effectiveDate').textContent = t.effectiveDate;
    document.getElementById('policyContent').innerHTML = t.content;
    document.getElementById('copyrightText').textContent = t.footer;
    homeLink.textContent = t.homeLabel;
    homeLink.href = 'index.html?lang=' + lang;
    document.documentElement.lang = lang;

    langDropdown.querySelectorAll('button[data-lang]').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.lang === lang);
    });
  }

  renderText(currentLang);

  function selectLang(lang){
    if (lang === currentLang) { langDropdown.style.display = 'none'; return; }
    currentLang = lang;
    renderText(currentLang);
    const newUrl = window.location.pathname + '?lang=' + currentLang;
    window.history.replaceState({}, '', newUrl);
    langDropdown.style.display = 'none';
  }

  menuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    langDropdown.style.display = 'none';
    dropdownMenu.style.display = dropdownMenu.style.display === 'block' ? 'none' : 'block';
  });

  langBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    dropdownMenu.style.display = 'none';
    const willOpen = langDropdown.style.display !== 'block';
    langDropdown.style.display = willOpen ? 'block' : 'none';
    langBtn.setAttribute('aria-expanded', String(willOpen));
  });

  langDropdown.querySelectorAll('button[data-lang]').forEach(btn => {
    btn.addEventListener('click', () => selectLang(btn.dataset.lang));
  });

  document.addEventListener('click', e => {
    if (!menuBtn.contains(e.target) && !dropdownMenu.contains(e.target)) {
      dropdownMenu.style.display = 'none';
    }
    if (!langBtn.contains(e.target) && !langDropdown.contains(e.target)) {
      langDropdown.style.display = 'none';
      langBtn.setAttribute('aria-expanded', 'false');
    }
  });
</script>
