<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>隐私政策 / Privacy Policy - Bai Mahjong</title>
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #2c2c2e;
        color: #f2f2f2;
        text-align: center;
        padding: 60px 20px;
        line-height: 1.6;
        transition: all 0.3s;
    }

    h1 {
        font-size: 2em;
        margin-bottom: 0.2em;
    }

    h2 {
        font-size: 1.2em;
        color: #ccc;
        margin-bottom: 1em;
    }

    a {
        color: #0a84ff;
        text-decoration: none;
    }

    a:hover {
        text-decoration: underline;
    }

    .lang-btn {
        position: fixed;
        top: 20px;
        right: 20px;
        background: #0a84ff;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 6px 10px;
        cursor: pointer;
        font-size: 0.9em;
        transition: background 0.3s;
    }

    .lang-btn:hover {
        background: #0066cc;
    }

    .policy-content {
        background: #3a3a3c;
        padding: 25px 30px;
        border-radius: 12px;
        margin: 20px auto;
        max-width: 800px;
        text-align: left;
    }

    .policy-content h3 {
        color: #f2f2f2;
        margin-top: 1.5em;
    }

    .policy-content p, .policy-content li {
        color: #ddd;
    }

    .policy-content ul {
        margin-left: 20px;
    }

    footer {
        margin-top: 40px;
        font-size: 0.9em;
        color: #aaa;
    }
</style>
</head>
<body>

<button class="lang-btn" id="langBtn"></button>

<h1 id="title"></h1>
<h2 id="subtitle"></h2>

<div class="policy-content" id="policyContent"></div>

<footer id="footer"></footer>

<script>
const langBtn = document.getElementById('langBtn');

// 自动识别浏览器语言
const userLang = navigator.language || navigator.userLanguage;
let currentLang = userLang.startsWith('zh') ? 'zh' : 'en';

const policyData = {
    zh: {
        title: '隐私政策',
        subtitle: 'Bai Mahjong - 数据与隐私说明',
        footer: '© 2026 Ge Hong · All Rights Reserved',
        btn: '🌐 English',
        content: `
<h3>1. 信息收集与使用</h3>
<p>我们致力于提供简洁、安全的游戏体验：</p>
<ul>
<li>不主动收集个人信息（PII），如姓名、邮箱、手机号或精准位置。</li>
<li>游戏进度和本地设置仅保存在您的设备上。</li>
</ul>

<h3>2. 第三方服务</h3>
<p>游戏使用以下第三方 SDK 提供广告和功能：</p>

<h4>Apple Game Center</h4>
<ul>
<li>提供排行榜和成就系统。</li>
<li>相关数据（昵称、分数）由 Apple 管理，我们不访问 Apple ID 密码或私人信息。</li>
</ul>

<h4>Google AdMob</h4>
<ul>
<li>可能收集设备标识符（IDFA，经授权）、IP、广告互动数据。</li>
<li>用于广告投放、频次控制、反作弊及性能统计。</li>
<li>详情请参阅 Google 隐私政策：
<a href="https://policies.google.com/privacy" target="_blank">https://policies.google.com/privacy</a></li>
</ul>

<h4>Unity Ads</h4>
<ul>
<li>可能收集设备标识符、IP、广告互动数据（IDFA 需用户授权）。</li>
<li>用于广告投放、统计分析及防作弊。</li>
<li>详情请参阅 Unity 隐私政策：
<a href="https://unity.com/legal/privacy-policy" target="_blank">https://unity.com/legal/privacy-policy</a></li>
</ul>

<h4>AppLovin</h4>
<ul>
<li>可能收集设备标识符、IP、广告互动数据（IDFA 需用户授权）。</li>
<li>用于广告投放、分析、性能统计及反作弊。</li>
<li>详情请参阅 AppLovin 隐私政策：
<a href="https://www.applovin.com/privacy/" target="_blank">https://www.applovin.com/privacy/</a></li>
</ul>

<h3>3. iOS 追踪透明度 (ATT)</h3>
<p>游戏支持 iOS ATT 框架。若拒绝授权，广告 ID（IDFA）不会被用于跨应用追踪。</p>

<h3>4. GDPR（欧洲用户）</h3>
<p>EEA 用户可请求访问、更正、删除个人数据，或撤回同意。</p>

<h3>5. CCPA（加州用户）</h3>
<p>加州用户可请求披露收集的个人信息类别，并要求删除。<strong>我们不向第三方出售用户数据。</strong></p>

<h3>6. 儿童隐私</h3>
<p>本游戏适合所有年龄，不会收集 13 岁以下儿童个人信息。</p>

<h3>7. 数据安全</h3>
<p>我们不维护云端用户数据，所有数据保存在设备上，卸载游戏时将被清除。</p>

<h3>8. 政策更新</h3>
<p>本隐私政策会根据新功能或法律要求更新，并在本页发布最新版本。</p>

<h3>9. 联系方式</h3>
<p>开发者：葛洪<br>📧 邮箱：<a href="mailto:gehong01@gmail.com">gehong01@gmail.com</a></p>
        `
    },
    en: {
        title: 'Privacy Policy',
        subtitle: 'Bai Mahjong - Data & Privacy',
        footer: '© 2026 Ge Hong · All Rights Reserved',
        btn: '🌐 中文',
        content: `
<h3>1. Information Collection and Use</h3>
<p>We are committed to providing a simple and privacy-respecting gaming experience:</p>
<ul>
<li>No direct collection of personally identifiable information (PII) such as name, email, phone number, or precise location.</li>
<li>Game progress and settings are stored locally on your device only.</li>
</ul>

<h3>2. Third-Party Services</h3>
<p>The game integrates the following third-party SDKs for ads and features:</p>

<h4>Apple Game Center</h4>
<ul>
<li>Provides leaderboards and achievements.</li>
<li>Data such as nickname and scores are managed by Apple. We do not access Apple ID passwords or private information.</li>
</ul>

<h4>Google AdMob</h4>
<ul>
<li>May collect device identifiers (IDFA, with consent), IP, and ad interaction data.</li>
<li>Used for ad delivery, frequency control, fraud prevention, and performance analytics.</li>
<li>See Google Privacy Policy: <a href="https://policies.google.com/privacy" target="_blank">https://policies.google.com/privacy</a></li>
</ul>

<h4>Unity Ads</h4>
<ul>
<li>May collect device identifiers, IP, advertising identifiers (IDFA with consent), and interaction data.</li>
<li>Used for ad delivery, analytics, and fraud prevention.</li>
<li>See Unity Privacy Policy: <a href="https://unity.com/legal/privacy-policy" target="_blank">https://unity.com/legal/privacy-policy</a></li>
</ul>

<h4>AppLovin</h4>
<ul>
<li>May collect device identifiers, IP, advertising identifiers (IDFA with consent), and interaction data.</li>
<li>Used for ad delivery, analytics, performance measurement, and fraud prevention.</li>
<li>See AppLovin Privacy Policy: <a href="https://www.applovin.com/privacy/" target="_blank">https://www.applovin.com/privacy/</a></li>
</ul>

<h3>3. App Tracking Transparency (ATT)</h3>
<p>On iOS devices, the game supports Apple's ATT framework. If you decline tracking authorization, advertising identifiers (IDFA) will not be accessed for cross-app tracking.</p>

<h3>4. GDPR (European Economic Area Users)</h3>
<p>EEA users may request access, correction, deletion of personal data, or withdraw consent.</p>

<h3>5. CCPA (California Residents)</h3>
<p>California residents may request disclosure of categories of personal information collected and request deletion. <strong>We do not sell personal data to third parties.</strong></p>

<h3>6. Children’s Privacy</h3>
<p>The game is suitable for all ages. No personal information from children under 13 is collected.</p>

<h3>7. Data Security</h3>
<p>We do not maintain cloud servers for user data. All data is stored on the device and deleted when the game is uninstalled.</p>

<h3>8. Policy Updates</h3>
<p>This Privacy Policy may be updated to reflect new features or legal requirements. Updates will be posted on this page.</p>

<h3>9. Contact</h3>
<p>Developer: Ge Hong<br>📧 Email: <a href="mailto:gehong01@gmail.com">gehong01@gmail.com</a></p>
        `
    }
};

function renderPolicy(lang) {
    document.getElementById('title').textContent = policyData[lang].title;
    document.getElementById('subtitle').textContent = policyData[lang].subtitle;
    document.getElementById('policyContent').innerHTML = policyData[lang].content;
    document.getElementById('footer').textContent = policyData[lang].footer;
    langBtn.textContent = policyData[lang].btn;
}

// 初始渲染
renderPolicy(currentLang);

// 手动切换语言
langBtn.addEventListener('click', () => {
    currentLang = currentLang === 'zh' ? 'en' : 'zh';
    renderPolicy(currentLang);
});
</script>

</body>
</html>
